# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + HMM híbrido (IF + HMM)
# ──────────────────────────────────────────────────────────────────────────────
# Combina Isolation Forest y HMM: escala Kelly = min(escala_IF, escala_HMM).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_hmm_hybrid.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_hmm_hybrid"
  description: "Exp1 + Exp3 + Conspiranoico híbrido (IF ∧ HMM, escala conservadora)"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  detector: "hybrid"
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
  hmm:
    n_states: 3
    n_iter: 100
    covariance_type: "diag"
