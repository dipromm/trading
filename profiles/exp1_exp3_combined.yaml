# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Exp1 suave (225555) + Exp3 veto suave del Conspiranoico.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/exp1_exp3_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_combined"
  description: "Menos fricción (Exp1 suave) + veto suave Conspiranoico (Exp3)"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
