# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + HMM
# ──────────────────────────────────────────────────────────────────────────────
# Mejor baseline Exp1+Exp3 con detector HMM en lugar de Isolation Forest.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_hmm_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_hmm_combined"
  description: "Exp1 menos fricción + Exp3 veto suave + Conspiranoico HMM"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  detector: "hmm"
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  hmm:
    n_states: 3
    n_iter: 100
    covariance_type: "diag"
