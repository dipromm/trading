# ──────────────────────────────────────────────────────────────────────────────
# Experimento 10: carry de posiciones entre ventanas walk-forward
# ──────────────────────────────────────────────────────────────────────────────
# Objetivo: no liquidar ni resetear al cambiar de iteración WF (más parecido a B&H).
# El modo default cierra todo al 31-dic de cada ventana → comisiones + salida forzada.
#
# Comparar contra default (cierre anual):
#   profiles/exp1_exp3_exp8_combined.yaml
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/exp10_carry_positions.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp10_carry_positions"
  description: "Exp10: posiciones continúan entre ventanas WF (sin cierre forzado)"

backtester:
  carry_positions_between_windows: true
