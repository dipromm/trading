# ──────────────────────────────────────────────────────────────────────────────
# Experimento 7: Rotación a defensivos en crisis severa
# ──────────────────────────────────────────────────────────────────────────────
# Objetivo: en tier severo del Conspiranoico (risk_scale <= 0.25), salir de
# equity y asignar ~30% a TLT/IEF/GLD según caps de asset_classes.
#
# Requiere --conspiranoico con veto_mode: soft.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp7_rotacion_defensivos.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp7_rotacion_defensivos"
  description: "Crisis severa → rotar a TLT/IEF/GLD"

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
  defensive_rotation:
    enabled: true
    trigger_scale: 0.25
    tickers: ["TLT", "IEF", "GLD"]
    total_allocation: 0.30
