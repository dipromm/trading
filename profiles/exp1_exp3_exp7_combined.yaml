# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 7 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Mejor stack (Exp1+Exp3) + rotación defensiva en crisis severa (Exp7).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/exp1_exp3_exp7_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp7_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp7 rotación defensiva"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
  defensive_rotation:
    enabled: true
    trigger_scale: 0.25
    tickers: ["TLT", "IEF", "GLD"]
    total_allocation: 0.30
