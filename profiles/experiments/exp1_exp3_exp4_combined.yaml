# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 4 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Mejor stack hasta ahora: menos fricción + veto suave + Cazador modulador.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_exp4_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp4_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp4 Cazador modulador"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15

cazador:
  mode: "risk_modulator"
  alert_kelly_scale: 0.5
