# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 6 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Mejor stack de ejecución (Exp1+Exp3) con Juez pass-through (Exp6).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_exp6_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp6_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp6 Juez pass-through"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15

judge_v1:
  mode: "pass_through"
