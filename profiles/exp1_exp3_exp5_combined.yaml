# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 5 combinados (mejor stack sin Exp4)
# ──────────────────────────────────────────────────────────────────────────────
# Exp1 suave + Exp3 veto suave + Exp5 Kelly boost en régimen normal.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/exp1_exp3_exp5_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp5_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp5 más exposición en régimen normal"

risk_manager:
  min_kelly_threshold: 0.01
  kelly_boost:
    enabled: true
    fraction: 0.6
    vix_percentile: 70
    require_normal_regime: true

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
