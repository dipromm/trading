# ──────────────────────────────────────────────────────────────────────────────
# Experimento 5: Más exposición en régimen normal
# ──────────────────────────────────────────────────────────────────────────────
# Objetivo: subir Kelly de 0.5 → 0.6 cuando VIX < p70 de train y Conspiranoico
# indica régimen normal (sin veto / risk_scale = 1.0).
#
# Requiere --conspiranoico (features de régimen incluyen VIX).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp5_mas_exposicion_normal.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp5_mas_exposicion_normal"
  description: "Kelly 0.6 en días normales (VIX bajo + Conspiranoico OK)"

risk_manager:
  kelly_boost:
    enabled: true
    fraction: 0.6
    vix_percentile: 70
    require_normal_regime: true
