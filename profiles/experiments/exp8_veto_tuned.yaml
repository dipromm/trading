# ──────────────────────────────────────────────────────────────────────────────
# Experimento 8: umbral Conspiranoico ajustado por tasa WF
# ──────────────────────────────────────────────────────────────────────────────
# Barrido walk-forward (scripts/diagnose_veto_walkforward.py --sweep 3,5,7,10,12)
# sobre Exp1+Exp3: todos cumplen criterio Exp8 (<10% en 2021/23/24, ~39% en 2022).
# p7 aporta tier severo (×0.25) en ~12% de días 2022 sin penalizar años buenos.
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp8_veto_tuned.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp8_veto_tuned"
  description: "Conspiranoico p7 — tuning por tasa de veto walk-forward (Exp8)"

conspiranoico:
  veto_mode: "soft"
  veto_threshold_percentile: 7
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
