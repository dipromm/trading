# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 8 (p3)
# ──────────────────────────────────────────────────────────────────────────────
# Exp1 suave + Exp3 veto suave + umbral Conspiranoico p3 (solo tier moderado en 2022).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_exp8_p3_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp8_p3_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp8 umbral p3"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  veto_threshold_percentile: 3
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
