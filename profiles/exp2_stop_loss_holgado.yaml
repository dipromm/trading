# ──────────────────────────────────────────────────────────────────────────────
# Experimento 2: Stop-loss más holgado
# ──────────────────────────────────────────────────────────────────────────────
# Objetivo: reducir salidas prematuras por stop-loss en mercados volátiles
# (especialmente 2022), sin tocar agentes ni el Juez.
#
# Cambio principal vs config base:
#   - stop_loss_atr_multiplier: 2.0 → 2.5 (salir solo si pérdida > 2.5 × ATR)
#
# Comparar contra baseline:
#   experiments/fase6_mat_cazador_conspiranoico_20260619_161511
#
# Uso (Exp2 aislado — solo stop-loss):
#   python run.py --cazador --conspiranoico --profile profiles/exp2_stop_loss_holgado.yaml
#
# Variante más holgada: cambiar stop_loss_atr_multiplier a 3.0 y re-ejecutar.
# Exp1+Exp2 juntos: usar profiles/exp1_exp2_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp2_stop_loss_holgado"
  description: "Stop-loss ATR 2.5x en lugar de 2.0x"

risk_manager:
  stop_loss_atr_multiplier: 2.5
