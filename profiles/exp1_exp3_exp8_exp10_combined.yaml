# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 8 + 10 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Mejor stack (Exp1+Exp3+Exp8 p7) + carry de posiciones entre ventanas WF (Exp10).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/exp1_exp3_exp8_exp10_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp8_exp10_combined"
  description: "Exp1 + Exp3 + Exp8 p7 + Exp10 carry posiciones WF"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3
  carry_positions_between_windows: true

conspiranoico:
  veto_mode: "soft"
  veto_threshold_percentile: 7
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
