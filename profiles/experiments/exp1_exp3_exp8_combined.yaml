# ──────────────────────────────────────────────────────────────────────────────
# Experimento 1 + 3 + 8 combinados
# ──────────────────────────────────────────────────────────────────────────────
# Mejor stack (Exp1+Exp3) + umbral Conspiranoico p7 calibrado por tasa WF (Exp8).
#
# Uso:
#   python run.py --cazador --conspiranoico --profile profiles/experiments/exp1_exp3_exp8_combined.yaml
# ──────────────────────────────────────────────────────────────────────────────

profile:
  name: "exp1_exp3_exp8_combined"
  description: "Exp1 suave + Exp3 veto suave + Exp8 umbral p7 (tuning WF)"

risk_manager:
  min_kelly_threshold: 0.01

backtester:
  min_prob_to_buy: 0.45
  sell_prob_threshold: 0.45
  sell_hysteresis_days: 3

conspiranoico:
  veto_mode: "soft"
  veto_threshold_percentile: 7
  soft_veto_scale_severe: 0.25
  soft_veto_scale_moderate: 0.6
  soft_veto_moderate_percentile: 15
